[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path="src/lib.rs"

[[bin]]
path="src/main.rs"
name="zero2prod"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "unicode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }