default_job = "check-all"

[jobs.check-all]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

[jobs.cov]
command = ["cargo", "llvm-cov", "nextest", "--lcov", "--summary-only", "--output-path", "lcov.info"]
need_stdout = true
analyzer = "nextest"

[jobs.run-long]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"

[jobs.fmt]
command = ["cargo", "fmt", "--all", "--check"]
need_stdout = true

[keybindings]
c = "job:clippy-all"
r = "job:run-long"
t = "job:nextest"
f = "job:fmt"